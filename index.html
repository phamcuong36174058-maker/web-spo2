<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình Theo dõi SpO2 & Nhịp tim</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>MONITOR THEO DÕI SINH HIỆU</h1>
                <p>Kết nối dữ liệu thời gian thực từ ESP32</p>
            </div>
            
            <div class="controls">
                <!-- Kết nối qua cáp USB (Serial) -->
                <button id="serialBtn" class="btn btn-primary" onclick="connectSerial()">🔌 Kết nối Cáp USB</button>
                
                <!-- Hoặc kết nối qua WiFi -->
                <div class="wifi-group">
                    <input type="text" id="espIp" placeholder="IP ESP32 (vd: 192.168.1.10)">
                    <button id="wsBtn" class="btn btn-secondary" onclick="connectWebSocket()">📶 WiFi</button>
                </div>

                <!-- Nút chạy thử dữ liệu giả -->
                <button id="simBtn" class="btn btn-outline" onclick="toggleSimulation()">▶ Chạy thử</button>
            </div>
        </header>

        <div class="status-bar">
            <span>Trạng thái: <strong id="connStatus" class="text-danger">Chưa kết nối</strong></span>
            <span id="rawLog">Dữ liệu thô: Chưa có</span>
        </div>

        <main class="cards">
            <!-- Thẻ SpO2 -->
            <div class="card spo2">
                <div class="card-header">
                    <span>NỒNG ĐỘ OXY TRONG MÁU (SpO2)</span>
                    <span class="badge" id="spo2Badge">--</span>
                </div>
                <div class="value-box">
                    <span id="spo2Val">--</span>
                    <small>%</small>
                </div>
                <div class="range-info">Mức bình thường: 95% - 100%</div>
            </div>

            <!-- Thẻ Nhịp tim -->
            <div class="card bpm">
                <div class="card-header">
                    <span>NHỊP TIM (HEART RATE)</span>
                    <span class="badge" id="bpmBadge">--</span>
                </div>
                <div class="value-box">
                    <span id="bpmVal">--</span>
                    <small>BPM</small>
                </div>
                <div class="range-info">Mức bình thường: 60 - 100 BPM</div>
            </div>
        </main>

        <!-- Biểu đồ -->
        <div class="chart-box">
            <canvas id="vitalsChart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
